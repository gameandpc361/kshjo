name: KashejoBot
options:
  bundleIdPrefix: com.kashejo
  deploymentTarget:
    iOS: "16.0"
targets:
  KashejoBot:
    type: application
    platform: iOS
    sources:
      - path: KashejoBot
    info:
      path: KashejoBot/Info.plist
      properties:
        CFBundleDisplayName: KashejoBot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  KashejoBot:
    build:
      targets:
        KashejoBot: all
