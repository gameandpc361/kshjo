name: Build unsigned iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project KashejoAssistant.xcodeproj \
            -scheme KashejoAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/KashejoAssistant.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr KashejoAssistant-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KashejoAssistant-unsigned-ipa
          path: KashejoAssistant-unsigned.ipa
          if-no-files-found: error
